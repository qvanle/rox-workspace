# Register alongside the client Service when selecting StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: <service>-headless
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  clusterIP: None
  selector:
    app: <service>
  ports:
    - name: http
      port: 80
      targetPort: http
