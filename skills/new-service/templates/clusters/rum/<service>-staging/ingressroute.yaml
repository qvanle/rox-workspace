apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <service>-staging
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`<staging-host>.rotexai.com`)
      services:
        - name: <service>
          port: 80
  tls:
    secretName: <service>-staging-tls
